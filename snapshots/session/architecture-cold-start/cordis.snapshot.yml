# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
# The architect tools on the headless session, for the cold-start flow of an
# Architecture Session. Headless does not mount agent presets, so the
# architect tool plugin mounts on the host plane here; the architect preset's
# tool mask is covered by the package tests and the Web pilot.
- insert:
    - id: architecture
      name: '@deepseek-ai/dsh-experimental-architecture'
      config:
        localDirectory: .dsh/architecture
    - id: tool-architecture-architect
      name: '@deepseek-ai/dsh-experimental-tool-architecture/architect'
