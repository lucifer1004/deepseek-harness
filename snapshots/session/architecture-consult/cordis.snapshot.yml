# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
# The architecture service with the worker consult tool, and an architect
# preset the consultation mounts into its hidden child agent. Headless ships
# no preset registry, so this patch inserts one with an empty default preset;
# the architect preset adds only the architecture tools on top of the base
# read and search tools, which the service's mask narrows to its allow list.
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: coding
    - id: preset-coding
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: coding
        plugins: []
    - id: preset-architect
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: architect
        plugins:
          - id: tool-architecture-architect
            name: '@deepseek-ai/dsh-experimental-tool-architecture/architect'
    - id: architecture
      name: '@deepseek-ai/dsh-experimental-architecture'
      config:
        mainBranch: main
        # Ruling records carry a random id and issue time, so they cannot be a
        # fixed workspace oracle; the package tests assert their contents. The
        # harness-owned .dsh root keeps them out of the workspace comparison.
        localDirectory: .dsh/architecture
    - id: tool-architecture
      name: '@deepseek-ai/dsh-experimental-tool-architecture'
